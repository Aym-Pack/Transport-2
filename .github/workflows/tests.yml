name: Run Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Add steps to build packages if necessary, e.g.,
      # - name: Build shared packages
      #   run: pnpm --filter './packages/*' build

      - name: Run tests
        run: pnpm --filter './apps/*' test # Adjust if tests are elsewhere or need a different command
